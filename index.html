      <!-- Formulaire d'avis : ouvre la messagerie avec un e-mail déjà rempli -->
      <!-- ?subject= donne un objet à l'e-mail ; les "name" des champs sont écrits en français car ils apparaissent dans le texte de l'e-mail -->
      <form class="review-form" action="mailto:aixplore.contact@gmail.com?subject=Avis%20sur%20le%20site%20Aixplore" method="post" enctype="text/plain">

        <!-- Nom du visiteur -->
        <label for="name">Nom</label>
        <input type="text" id="name" name="Nom" placeholder="Camille Martin" autocomplete="name" minlength="2" maxlength="80" required>

        <!-- Adresse e-mail du visiteur -->
        <label for="email">E-mail</label>
        <input type="email" id="email" name="E-mail" placeholder="camille.martin@etu.univ-amu.fr" autocomplete="email" required>

        <!-- Rubrique concernée par l'avis -->
        <label for="category">Rubrique</label>
        <select id="category" name="Rubrique" required>
          <option value="">-- Choisir une rubrique --</option>
          <option value="Accueil">Accueil</option>
          <option value="Soirées">Soirées</option>
          <option value="Sports">Sports</option>
          <option value="Bons plans">Bons plans</option>
          <option value="Liens utiles">Liens utiles</option>
        </select>

        <!-- Note de 1 à 5 : boutons radio (une seule note possible) regroupés dans un fieldset -->
        <fieldset class="rating">
          <legend>Note</legend>
          <label><input type="radio" name="Note" value="1/5 - Mauvais" required> 1 ★ Mauvais</label>
          <label><input type="radio" name="Note" value="2/5 - Décevant"> 2 ★ Décevant</label>
          <label><input type="radio" name="Note" value="3/5 - Moyen"> 3 ★ Moyen</label>
          <label><input type="radio" name="Note" value="4/5 - Bien"> 4 ★ Bien</label>
          <label><input type="radio" name="Note" value="5/5 - Excellent"> 5 ★ Excellent</label>
        </fieldset>

        <!-- Message de l'avis -->
        <label for="message">Message</label>
        <textarea id="message" name="Message" rows="5" placeholder="Ce qui t'a plu, ce qui manque, un bon plan à partager…" minlength="10" maxlength="1000" required></textarea>

        <!-- Bouton d'envoi -->
        <button type="submit" class="submit-button">Envoyer</button>
      </form>
