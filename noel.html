<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Page secrète : active le style de Noël (style alternatif) puis renvoie vers l'accueil -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noël | Aixplore</title>
  <meta name="description" content="Page secrète d'Aixplore : active le style de Noël du site.">

  <!-- Page utilitaire : on demande aux moteurs de recherche de ne pas l'indexer -->
  <meta name="robots" content="noindex">

  <!-- Icône Aixplore affichée dans l'onglet du navigateur -->
  <link rel="icon" href="img/aixplore/aixplore-favicon.png" type="image/png">

  <script>
    try {
      localStorage.setItem("christmas", "on"); // Le navigateur retient que le style de Noël est allumé
    } catch (error) {}
    window.location.href = "index.html"; // Retour à l'accueil, déjà en style de Noël
  </script>
</head>
<body>
  <!-- S'affiche seulement si le JavaScript est désactivé -->
  <p>🎄 Joyeux Noël ! <a href="index.html">Retour au site</a></p>
</body>
</html>
